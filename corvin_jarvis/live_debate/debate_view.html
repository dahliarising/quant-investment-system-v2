<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 실시간 투자 토론</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --kakao-bg:#a7c0d4; --header:#9db6cb; --me:#fde64b; --other:#fff; --text:#1a1a1a; --time:#5b6b78;
    --value:#e0a82e; --growth:#2e86ff; --trend:#ff5b5b; --macro:#1faf6a; --quant:#9b59ff;
    --cut:#ff5b5b; --buy:#2e86ff; --hold:#1faf6a;
    --ok:#1faf6a; --warn:#e0a82e; --bad:#ff5b5b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#5a6b78;font-family:'Noto Sans KR',sans-serif;display:flex;justify-content:center;min-height:100vh;}
  .phone{width:100%;max-width:470px;background:var(--kakao-bg);min-height:100vh;display:flex;flex-direction:column;position:relative;}
  .hdr{position:sticky;top:0;z-index:20;background:var(--header);padding:11px 14px;display:flex;align-items:center;gap:10px;}
  .hdr .ttl{font-weight:700;font-size:15px;color:#1c2730;flex:1;}
  .controls{background:#eef3f7;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #d6dee5;position:sticky;top:42px;z-index:19;}
  .seg{display:flex;border:1px solid #b6c2cd;border-radius:8px;overflow:hidden;}
  .seg button{border:0;background:#fff;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
  .seg button.on{background:#33414d;color:#fff;}
  .live-tog{font-size:12px;color:#46586a;display:flex;align-items:center;gap:4px;cursor:pointer;}
  .start{margin-left:auto;background:#fee500;border:0;border-radius:8px;padding:7px 16px;font-weight:700;font-size:13px;cursor:pointer;}
  .start:disabled{opacity:.5;}
  .dataconf{font-size:11px;color:#46586a;width:100%;}
  .chat{flex:1;padding:14px 12px 14px;display:flex;flex-direction:column;gap:3px;}
  .row{display:flex;gap:8px;align-items:flex-start;margin-top:11px;}
  .row.me{flex-direction:row-reverse;margin-top:9px;}
  .avatar{width:38px;height:38px;border-radius:13px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;font-size:19px;background:#e3eaf0;}
  .col{display:flex;flex-direction:column;max-width:80%;}
  .name{font-size:12px;color:#33414d;margin:0 0 4px 3px;font-weight:600;}
  .name .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:5px;color:#fff;}
  .name .cred{font-size:10px;font-weight:700;margin-left:5px;cursor:help;}
  .bubble-line{display:flex;align-items:flex-end;gap:6px;}
  .me .bubble-line{flex-direction:row-reverse;}
  .bubble{background:var(--other);color:var(--text);font-size:14.5px;line-height:1.5;padding:9px 12px;border-radius:16px;box-shadow:0 1px 1px rgba(0,0,0,.08);}
  .me .bubble{background:var(--me);}
  .badge{font-size:10px;font-weight:700;margin-left:6px;padding:1px 5px;border-radius:6px;}
  .b-verified{background:rgba(31,175,106,.15);color:var(--ok);}
  .b-unverified{background:rgba(224,168,46,.18);color:var(--warn);}
  .b-mismatch{background:rgba(255,91,91,.16);color:var(--bad);}
  .round-pill{align-self:center;background:rgba(60,80,95,.3);color:#fff;font-size:11px;padding:4px 13px;border-radius:13px;margin:12px 0 2px;}
  .typing{align-self:flex-start;background:#fff;border-radius:16px;padding:10px 14px;margin:8px 0 0 46px;display:none;}
  .typing.show{display:block;}
  .typing span{display:inline-block;width:7px;height:7px;background:#9aa6b2;border-radius:50%;margin:0 2px;animation:bd 1s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes bd{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-4px);}}
  .foot{align-self:center;color:#3a4a57;font-size:11px;margin:10px 0;text-align:center;opacity:.85;}
  /* 참여 입력 바 */
  .askbar{position:sticky;bottom:0;background:#dfe6ec;border-top:1px solid #c4cfd8;padding:9px 10px;display:flex;gap:8px;align-items:center;}
  .askbar input{flex:1;border:1px solid #b6c2cd;border-radius:20px;padding:9px 14px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .askbar input:disabled{background:#eef1f4;}
  .askbar button{border:0;background:#fee500;border-radius:50%;width:38px;height:38px;font-size:17px;font-weight:700;cursor:pointer;}
  .askbar button:disabled{opacity:.4;}
</style>
</head>
<body>
<div class="phone">
  <div class="hdr"><div class="ttl">💬 실시간 투자 토론 <span style="font-size:11px;color:#46586a">· 검증 라이브</span></div></div>
  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-mode="style" class="on">투자방법 5인</button>
      <button data-mode="stance">손절·매수·홀딩</button>
    </div>
    <label class="live-tog"><input type="checkbox" id="liveChk"> ⚡라이브(AI)</label>
    <button class="start" id="startBtn">▶ 토론 시작</button>
    <div class="dataconf" id="dataConf"></div>
  </div>
  <div class="chat" id="chat">
    <div class="foot">모드 고르고 ▶ 토론 시작 — 말풍선이 실시간 등장<br>아래 입력창으로 <b>폐하도 끼어들어</b> 질문/의견 → 에이전트가 답합니다<br>각 발언엔 ✓검증 / ⚠️미검증 / ✗불일치 배지</div>
  </div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>
  <div class="askbar">
    <input id="askInput" placeholder="폐하도 한마디… (질문/의견 입력)" disabled>
    <button id="sendBtn" disabled>↑</button>
  </div>
</div>
<script>
const ACCENT = {value:'#e0a82e',growth:'#2e86ff',trend:'#ff5b5b',macro:'#1faf6a',quant:'#9b59ff',cut:'#ff5b5b',buy:'#2e86ff',hold:'#1faf6a'};
const BADGE = {verified:['✓','b-verified'],unverified:['⚠️','b-unverified'],mismatch:['✗','b-mismatch']};
let mode='style', src=null, lastRound=null, busy=false;
const chat=document.getElementById('chat'), typing=document.getElementById('typing');
const startBtn=document.getElementById('startBtn'), dataConf=document.getElementById('dataConf');
const liveChk=document.getElementById('liveChk');
const askInput=document.getElementById('askInput'), sendBtn=document.getElementById('sendBtn');

document.getElementById('modeSeg').addEventListener('click',e=>{
  if(e.target.dataset.mode){mode=e.target.dataset.mode;
    [...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));}
});
startBtn.addEventListener('click',()=>runStream('/debate/stream'));
sendBtn.addEventListener('click',sendAsk);
askInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendAsk();});

function fakeFlag(){return liveChk.checked?0:1;}
function setBusy(b){busy=b;startBtn.disabled=b;sendBtn.disabled=b||!askInput.value.trim();askInput.disabled=b;}

function runStream(endpoint, extra=''){
  if(src) src.close();
  chat.innerHTML=''; lastRound=null; setBusy(true);
  startBtn.textContent='● 진행중…'; showTyping();
  src=new EventSource(`${endpoint}?mode=${mode}&fake=${fakeFlag()}${extra}`);
  src.onmessage=onEvent; src.onerror=finish;
}
function sendAsk(){
  const q=askInput.value.trim(); if(!q||busy) return;
  renderMe(q); askInput.value=''; setBusy(true); showTyping();
  if(src) src.close();
  src=new EventSource(`/debate/ask?mode=${mode}&fake=${fakeFlag()}&q=${encodeURIComponent(q)}`);
  src.onmessage=onEvent; src.onerror=finish;
}
function onEvent(ev){
  const d=JSON.parse(ev.data);
  if(d.kind==='header'){dataConf.textContent='📡 '+(d.note||'')+(d.low_confidence&&d.low_confidence.length?` · ⚠️저신뢰: ${d.low_confidence.join(',')}`:' · 검증✓'); return;}
  if(d.kind==='done'){finish(); return;}
  if(d.kind==='turn'){renderTurn(d);}
}
function showTyping(){typing.classList.add('show');chat.after(typing);}
function finish(){ if(src)src.close(); typing.classList.remove('show'); setBusy(false);
  startBtn.textContent='▶ 다시 토론'; askInput.disabled=false; sendBtn.disabled=!askInput.value.trim();
  askInput.placeholder='폐하도 한마디… (질문/의견 입력)'; }
askInput.addEventListener('input',()=>{sendBtn.disabled=busy||!askInput.value.trim();});

function roundPill(r){if(r===lastRound)return;lastRound=r;
  const labels={opening:'🗣️ 오프닝',rebuttal:'🔥 반박',synthesis:'🧾 정리',reply:'💬 폐하께 답변'};
  const p=document.createElement('div');p.className='round-pill';p.textContent=labels[r]||r;chat.appendChild(p);}

function renderMe(text){
  lastRound='__me__';
  const row=document.createElement('div');row.className='row me';
  const col=document.createElement('div');col.className='col';
  const bl=document.createElement('div');bl.className='bubble-line';
  const bb=document.createElement('div');bb.className='bubble';bb.textContent=text;
  bl.appendChild(bb);col.appendChild(bl);row.appendChild(col);
  chat.appendChild(row);chat.after(typing);scroll();
}
function renderTurn(t){
  roundPill(t.round);
  const row=document.createElement('div');row.className='row';
  const av=document.createElement('div');av.className='avatar';av.textContent=t.avatar;
  av.style.boxShadow=`0 0 0 2px ${ACCENT[t.accent]||'#888'},0 1px 2px rgba(0,0,0,.12)`;
  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';
  const cc=t.credibility>=80?'#1faf6a':t.credibility>=65?'#e0a82e':'#ff5b5b';
  const credHtml=t.credibility?` <span class="cred" style="color:${cc}" title="${(t.cred_note||'').replace(/"/g,'')}">🎯${t.credibility}</span>`:'';
  nm.innerHTML=`${t.name} <span class="tag" style="background:${ACCENT[t.accent]||'#888'}">${t.tag||''}</span>${credHtml}`;
  const bl=document.createElement('div');bl.className='bubble-line';
  const bb=document.createElement('div');bb.className='bubble';bb.textContent=t.text;
  if(t.badge&&BADGE[t.badge]){const b=document.createElement('span');b.className='badge '+BADGE[t.badge][1];b.textContent=BADGE[t.badge][0];bb.appendChild(b);}
  bl.appendChild(bb);col.appendChild(nm);col.appendChild(bl);row.appendChild(av);row.appendChild(col);
  chat.appendChild(row);chat.after(typing);scroll();
}
function scroll(){window.scrollTo(0,document.body.scrollHeight);}
</script>
</body>
</html>
